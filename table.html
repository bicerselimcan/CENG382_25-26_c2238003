<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Page</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Iceberg&display=swap" rel="stylesheet">
  <script src="tableScript.js" defer></script>

</head>
<body>

<div class="container">
  <h1>WELCOME TO THE TABLE PAGE!</h1>
  <p>You have successfully logged in as an admin.</p>

  <br>
  <a href="index.html">Go back to Login Page</a>
</div>

<!-- Form -->
<form id="class-form">
  <input type="text" id="class-name" placeholder="Class Name" required>
  <input type="number" id="num-people" placeholder="Number of People" required>
  <textarea id="description" placeholder="Description" required></textarea>
  <button type="submit">Add Class</button>
</form>

<!-- Tablo -->
<table id="class-table">
  <thead>
  <tr>
    <th>Class Name</th>
    <th>Number of People</th>
    <th>Description</th>
  </tr>
  </thead>
  <tbody>
  <!-- Dinamik Veriler Buraya Ekleniyor -->
  </tbody>
</table>

</body>
</html>
